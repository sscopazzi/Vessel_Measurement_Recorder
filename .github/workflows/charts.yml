# Builds the VMR chart packs (charts/regions.json) from NOAA's latest charts each month and publishes
# them as a release named charts-YYYY-MM-DD. Run it by hand from the Actions tab too ("Run workflow").
name: Chart packs

on:
  schedule:
    - cron: "17 10 3 * *"        # the 3rd of each month, 10:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Pack names to build, separated by spaces (blank for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build the packs
        run: |
          ONLY="${{ github.event.inputs.only }}"
          python3 charts/build_packs.py --out packs --work noaa ${ONLY:+--only $ONLY}
          ls -la packs

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="charts-$(date -u +%Y-%m-%d)"
          python3 - > notes.md <<'PY'
          import json
          p = json.load(open("packs/packs.json"))
          print("VMR chart packs built %s from NOAA's Chart Display Service (ENC). **Not for navigation.**\n" % p["built"])
          print("Download a pack, then on the VMR dashboard go to Setup › Charts and upload it (not while recording).\n")
          print("| Pack | Area | Size | NOAA charts as of | NOAA files |\n|---|---|---|---|---|")
          for k in p["packs"]:
              print("| %s | %s | %.0f MB | %s | %s |" % (k["file"], k["title"], k["bytes"] / 1e6, k["chart_date"], ", ".join(k["noaa"])))
          PY
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" packs/*.vmrchart packs/packs.json \
            --title "Chart packs $(date -u +%Y-%m-%d)" --notes-file notes.md --latest=false
