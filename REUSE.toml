version = 1
SPDX-PackageName = "Aspect Wave VMR (Vessel Measurement Recorder) + SeaLabMOS"
SPDX-PackageSupplier = "Aspect Wave LLC"
SPDX-PackageDownloadLocation = "https://github.com/sscopazzi/Vessel_Measurement_Recorder"

# Prose documentation, screen images, white papers and their data
[[annotations]]
path = ["**.md", "docs/VMR_Overview.pdf", "docs/VMR_Calculations.pdf", "docs/VMR_Controls.pdf",
        "docs/VMR_Known_Limitations.pdf", "docs/VMR_Overview.docx", "docs/VMR_Calculations.docx",
        "docs/VMR_Controls.docx", "docs/VMR_Known_Limitations.docx", "docs/VMR_Label_Text.txt",
        "docs/OLED_screens.png", "docs/VMR_v*_LCD_screens.png", "white_papers_and_testing/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Analysis notebook: permissive, like vmr_reader.py
[[annotations]]
path = "white_papers_and_testing/**.ipynb"
precedence = "override"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "MIT"

# Hardware design source
[[annotations]]
path = ["docs/wiring/**", "docs/VMR_Bill_of_Materials_*", "docs/VMR_WTB_IWB_Interface_Spec.pdf",
        "docs/VMR_WTB_IWB_Interface_Spec.docx"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Files that can't carry a header, or are generated: the logo, chart regions, the built demo
[[annotations]]
path = ["VMR/web/logo.svg", "charts/regions.json", "docs/index.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aspect Wave LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Demo WebAssembly: VMR firmware compiled with Adafruit GFX and the SH110X splash
[[annotations]]
path = "docs/demo/wasm/vmr.wasm"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Aspect Wave LLC", "2012 Adafruit Industries"]
SPDX-License-Identifier = "GPL-3.0-or-later AND BSD-2-Clause AND BSD-3-Clause"

# GSW-C (TEOS-10), copied verbatim: no headers added to these files
[[annotations]]
path = ["SeaLabMOS_*/teos10.c", "SeaLabMOS_*/gsw_internal_const.h"]
precedence = "override"
SPDX-FileCopyrightText = "2011 SCOR/IAPSO WG127"
SPDX-License-Identifier = "LicenseRef-GSW"

# Leaflet, unchanged
[[annotations]]
path = "charts/leaflet/**"
precedence = "override"
SPDX-FileCopyrightText = ["2010-2023 Vladimir Agafonkin", "2010-2011 CloudMade"]
SPDX-License-Identifier = "BSD-2-Clause"
